# Complete repository configuration using Codex as an independent reviewer.
# Each `review run` or shadow `review compare` invokes the reviewer wrapper once. The
# wrapper does not expose provider request, token, or cost telemetry; do not infer it
# from this invocation. Defaults: `gpt-5.3-codex` at explicit `medium` effort (Codex CLI
# 0.153.0, via `-c model_reasoning_effort=...`).
[general]
base_ref = "main"

[commands]
lint = "ruff check ."
test = "pytest"

[stage]
# The wrapper defaults to 600 seconds; leave it time to report its own timeout cleanly.
timeout_seconds = 660
max_attempts = 5

[review]
blocking_severities = ["critical", "high"]
max_findings = 50
require_fix_commits = true
executor = "command"
command = "python3 -B docs/examples/reviewers/codex_review.py"
# Set AP_REVIEWER_MODEL and AP_REVIEWER_EFFORT to exact values supported by your Codex CLI.
# Alternative: keep executor = "in_harness" and require the paid command only for high risk.
# require_command_for = ["high"]
require_command_for = []

[policy]
human_review_paths = [".agentic-preflight.toml", ".github/workflows/**", "CODEOWNERS"]
high_risk_paths = ["db/migrations/**", "infra/**"]
medium_risk_paths = ["dependencies/**"]

[docs]
enabled = true
paths = []
require_changelog = false
blocking_severities = ["critical", "high"]

[diff]
max_bytes = 200000
exclude = [
    "*.lock",
    "*-lock.json",
    "vendor/**",
    "**/*.min.js",
    "**/*.min.css",
    "**/__snapshots__/**",
    "**/*.pb.go",
    "**/*_pb2.py",
]

[worktree]
mode = "in_place"
copy_files = []

[gate]
mode = "token"

[pr]
mode = "auto"
automatedCleanup = false

[approval]
mode = "manual_merge"
environment = "high-risk-review"

[hook]
enabled = true
allow_force_push = false
