name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        For security vulnerabilities, stop and follow SECURITY.md instead of filing a
        public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of commands that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Agentic Preflight, OS, Python, and Git versions.
    validations:
      required: true
  - type: textarea
    id: envelope
    attributes:
      label: JSON envelope and logs
      description: Remove secrets and private repository content before pasting output.
      render: shell
