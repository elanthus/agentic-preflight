name: Test

# Single definition of the test matrix, called by ci.yml and release.yml. Both
# callers used to carry their own copy of these steps, including the pinned
# action SHAs, with nothing keeping them in step. Release, manual, and scheduled
# callers now select their own compatibility coverage without duplicating the
# test implementation.

on:
  workflow_call:
    inputs:
      os:
        description: JSON array of runner labels, e.g. '["ubuntu-latest"]'.
        type: string
        required: true
      python-versions:
        description: JSON array of Python versions, e.g. '["3.13"]'.
        type: string
        required: true
      coverage:
        description: >
          Measure coverage, which also applies the fail_under floor from
          pyproject.toml, and produce the badge artifact on push events.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check agentic_preflight tests

      - name: Format check (ruff)
        run: uv run ruff format --check agentic_preflight tests

      - name: Type check (mypy)
        run: uv run mypy agentic_preflight

      - name: Test (pytest)
        run: uv run pytest ${{ inputs.coverage && '--cov=agentic_preflight --cov-report=term-missing --cov-report=xml' || '' }}

      # Deliberately not pinned to a specific os/python-version. The callers
      # choose the matrix, so naming a combination here would mean two files
      # having to agree with nothing enforcing it. Relies instead on the
      # invariant that the only caller passing coverage: true, ci.yml, passes a
      # single combination on push events. If that ever stops being true, these
      # steps would run more than once and upload-artifact would reject the
      # duplicate name.
      - name: Generate coverage badge
        if: inputs.coverage && github.event_name == 'push'
        run: |
          coverage_percent="$(uv run coverage report --format=total)"
          if [ "$coverage_percent" -ge 90 ]; then
            color=brightgreen
          elif [ "$coverage_percent" -ge 80 ]; then
            color=green
          elif [ "$coverage_percent" -ge 70 ]; then
            color=yellowgreen
          elif [ "$coverage_percent" -ge 60 ]; then
            color=yellow
          else
            color=red
          fi
          curl --fail --silent --show-error --location \
            "https://img.shields.io/badge/coverage-${coverage_percent}%25-${color}.svg" \
            --output coverage.svg

      - name: Upload coverage badge
        if: inputs.coverage && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error
