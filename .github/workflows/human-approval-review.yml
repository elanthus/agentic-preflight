name: Human approval review

# A review event runs the workflow file from the pull request's merge ref, with a
# read-only token when the pull request comes from a fork. Nothing here is
# trusted: this job only records which pull request was reviewed. The companion
# human-approval-rerun.yml always runs from the default branch; it verifies the
# number against the repository API and re-runs the protected-base
# "Human approval policy" run for the pull request's current head.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    name: relay the reviewed pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the reviewed pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/pr-number"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: human-approval-review
          path: ${{ runner.temp }}/pr-number
          retention-days: 1
