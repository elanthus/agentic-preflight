name: Human approval policy

on:
  pull_request_target:
    types:
      [opened, reopened, synchronize, ready_for_review, auto_merge_enabled, auto_merge_disabled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  dependabot-policy:
    uses: ./.github/workflows/dependabot-policy.yml

  policy:
    needs: dependabot-policy
    if: always() && needs.dependabot-policy.outputs.eligible != 'true'
    name: evaluate high-risk approval policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      approved: ${{ steps.policy.outputs.approved }}
      approval_mode: ${{ steps.policy.outputs.approval_mode }}
      environment: ${{ steps.policy.outputs.environment }}
      requires_approval: ${{ steps.policy.outputs.requires_approval }}
      dependabot_exempt: ${{ steps.dependabot.outputs.verified }}
    steps:
      # pull_request_target is safe here because every executable comes from the
      # protected base. The proposed branch is fetched only as inert Git data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install the trusted policy checker
        run: uv tool install --python 3.11 .

      - name: Evaluate approval policy for the exact head
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source_remote=origin
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            git remote add preflight-contributor "$HEAD_REPOSITORY_URL"
            source_remote=preflight-contributor
          fi
          git fetch --no-tags -- "$source_remote" "$HEAD_SHA" \
            '+refs/notes/agentic-preflight:refs/notes/agentic-preflight' \
            '+refs/agentic-preflight/evidence/*:refs/agentic-preflight/evidence/*'
          reviews_file="$RUNNER_TEMP/pull-request-reviews.json"
          result_file="$RUNNER_TEMP/approval-policy.json"
          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$reviews_file"
          policy_exit=0
          agentic-preflight approval-check "$HEAD_SHA" \
            --base "$BASE_SHA" \
            --reviews-file "$reviews_file" \
            --author "$PR_AUTHOR" \
            --report-only \
            > "$result_file" || policy_exit=$?
          cat "$result_file"
          if [ "$policy_exit" -ne 0 ]; then
            exit "$policy_exit"
          fi
          approval_mode=$(jq -r '.data.approval_mode' "$result_file")
          approval_environment=$(jq -r '.data.approval_environment' "$result_file")
          requires_approval=$(jq -r '.data.requires_human_approval' "$result_file")
          if [ "$requires_approval" = "true" ] && [ "$approval_mode" = "manual_merge" ]; then
            auto_merge=$(gh api \
              "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.auto_merge != null')
            if [ "$auto_merge" = "true" ]; then
              echo "Disable auto-merge; this high-risk pull request requires a manual merge." >&2
              exit 1
            fi
          fi
          if [ "$requires_approval" = "true" ] && [ "$approval_mode" = "environment" ]; then
            environments_file="$RUNNER_TEMP/environments.json"
            gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/environments?per_page=100" \
              > "$environments_file"
            jq -e --arg environment "$approval_environment" '
              any(.[] | .environments[]?;
                .name == $environment and
                any(.protection_rules[]?;
                  .type == "required_reviewers" and
                  ((.reviewers // []) | length > 0)))
            ' "$environments_file" > /dev/null || {
              echo "Environment $approval_environment must exist with a required reviewer." >&2
              exit 1
            }
          fi
          echo "approved=$(jq -r '.data.approved' "$result_file")" >> "$GITHUB_OUTPUT"
          echo "approval_mode=$approval_mode" >> "$GITHUB_OUTPUT"
          echo "environment=$approval_environment" >> "$GITHUB_OUTPUT"
          echo "requires_approval=$requires_approval" >> "$GITHUB_OUTPUT"

      - name: Verify Dependabot contributions for the exact head
        id: dependabot
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.user.type == 'Bot' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout and script are from the protected base. PR code is
          # inspected only as Git objects, after normal attestation verification.
          commits_file="$RUNNER_TEMP/dependabot-approval-commits.json"
          pr_file="$RUNNER_TEMP/dependabot-approval-pr.json"
          result_file="$RUNNER_TEMP/dependabot-approval.json"
          gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" > "$commits_file"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_file"
          uv run --locked --no-dev --python 3.11 python .github/scripts/verify_dependabot.py \
            --repository "$GITHUB_REPOSITORY" --head "$HEAD_SHA" --base "$BASE_SHA" \
            --pr-file "$pr_file" --commits-file "$commits_file" > "$result_file"
          cat "$result_file"
          echo "verified=$(jq -r '.verified' "$result_file")" >> "$GITHUB_OUTPUT"

  environment:
    name: owner environment approval
    needs: policy
    if: >-
      needs.policy.outputs.requires_approval == 'true' &&
      needs.policy.outputs.dependabot_exempt != 'true' &&
      needs.policy.outputs.approval_mode == 'environment'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.policy.outputs.environment }}
    steps:
      - run: echo "Environment approval recorded for this workflow run."

  approval:
    name: high-risk human approval
    needs: [dependabot-policy, policy, environment]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the configured approval result
        env:
          DEPENDABOT_ELIGIBLE: ${{ needs.dependabot-policy.outputs.eligible }}
          DEPENDABOT_EXEMPT: ${{ needs.policy.outputs.dependabot_exempt }}
          APPROVED: ${{ needs.policy.outputs.approved }}
          APPROVAL_MODE: ${{ needs.policy.outputs.approval_mode }}
          ENVIRONMENT_RESULT: ${{ needs.environment.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRES_APPROVAL: ${{ needs.policy.outputs.requires_approval }}
        run: |
          if [ "${DEPENDABOT_ELIGIBLE:-false}" = "true" ]; then
            echo "Verified Dependabot patch/minor dependency update."
            exit 0
          fi
          test "$POLICY_RESULT" = "success"
          if [ "${DEPENDABOT_EXEMPT:-false}" = "true" ]; then
            echo "Verified Dependabot contributions; human review is not required."
          elif [ "$REQUIRES_APPROVAL" != "true" ]; then
            echo "No high-risk approval is required."
          elif [ "$APPROVAL_MODE" = "manual_merge" ]; then
            echo "High-risk change verified; a person must perform the merge manually."
          elif [ "$APPROVAL_MODE" = "environment" ]; then
            test "$ENVIRONMENT_RESULT" = "success"
            echo "GitHub Environment approval recorded for the exact workflow run."
          elif [ "$APPROVAL_MODE" = "peer_review" ] || [ "$APPROVAL_MODE" = "owner_review" ]; then
            test "$APPROVED" = "true"
            echo "Eligible review approval recorded for the exact head."
          else
            echo "Unknown approval mode: $APPROVAL_MODE" >&2
            exit 1
          fi
