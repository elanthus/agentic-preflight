name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 8 * * 2"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the locked audit environment
        run: uv sync --locked --group dev --python 3.13

      - name: Export locked runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt --output-file ${{ runner.temp }}/runtime-requirements.txt

      - name: Audit runtime dependencies
        run: >-
          uv run pip-audit --requirement ${{ runner.temp }}/runtime-requirements.txt
          --require-hashes --disable-pip

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
