name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 8 * * 2"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install the locked audit environment
        run: uv sync --locked --group dev --python 3.13

      - name: Export locked runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt --output-file ${{ runner.temp }}/runtime-requirements.txt

      - name: Audit runtime dependencies
        run: >-
          uv run pip-audit --requirement ${{ runner.temp }}/runtime-requirements.txt
          --require-hashes --disable-pip

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
