name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 8 * * 2"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Export locked runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt --output-file ${{ runner.temp }}/runtime-requirements.txt

      - name: Audit runtime dependencies
        run: >-
          uvx --python 3.13 pip-audit@2.10.1 --requirement ${{ runner.temp }}/runtime-requirements.txt
          --require-hashes --disable-pip

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
