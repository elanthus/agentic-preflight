name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Manual runs get a group of their own, keyed by run id, so nothing can
  # supersede them. They are the documented pre-tag release check, and a
  # cancelled run reports neither pass nor fail: a releaser who sees the jobs
  # start and moves on to tagging would get the ceremony without the guarantee.
  # Pushes and pull requests keep the useful behaviour, where a newer run on the
  # same ref cancels the older one.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Single combo for fast PR feedback. Run this workflow manually
    # (workflow_dispatch) to expand to the full matrix -- useful as a pre-tag
    # check, since release.yml only gates publishing after the tag is already
    # pushed.
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]' }}
      python-versions: ${{ github.event_name == 'workflow_dispatch' && '["3.11", "3.12", "3.13"]' || '["3.13"]' }}
      coverage: true

  package:
    name: built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Build wheel
        run: uv build --wheel

      - name: Install and invoke the built tool
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/agentic-preflight" --version
          # -P keeps the current directory off sys.path. Without it this runs from
          # the repository root, where the agentic_preflight source directory
          # shadows the installed package and the assertions inspect the checkout
          # instead of the wheel, passing even when the wheel is incomplete.
          "$UV_TOOL_DIR/agentic-preflight/bin/python" -P - <<'PY'
          import importlib.resources as resources

          package = resources.files("agentic_preflight")
          assert package.joinpath("py.typed").is_file(), "py.typed missing from wheel"
          assert package.joinpath("_bundled_skill").is_dir(), "bundled skill missing from wheel"
          print("wheel contents verified")
          PY

  publish-coverage-badge:
    name: publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge

      - name: Publish badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          mv coverage.svg "$publish_dir/coverage.svg"
          cd "$publish_dir"
          git init --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.svg
          git commit -m "Update coverage badge"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin badges
