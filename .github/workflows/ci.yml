name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check agentic_preflight tests

      - name: Type check (mypy)
        run: uv run mypy agentic_preflight

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=agentic_preflight --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Build wheel
        run: uv build --wheel

      - name: Install and invoke the built tool
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/agentic-preflight" --version
          "$UV_TOOL_DIR/agentic-preflight/bin/python" -c "import importlib.resources as r; assert r.files('agentic_preflight').joinpath('py.typed').is_file()"

  coverage:
    name: upload coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Defer coverage upload until the trusted branch build
        if: github.event_name == 'pull_request'
        run: echo "Coverage uploads run after merge on the trusted branch build."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'pull_request'

      - name: Download coverage artifact
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true
