name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check agentic_preflight tests

      - name: Type check (mypy)
        run: uv run mypy agentic_preflight

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=agentic_preflight --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          coverage_percent="$(uv run coverage report --format=total)"
          if [ "$coverage_percent" -ge 90 ]; then
            color=brightgreen
          elif [ "$coverage_percent" -ge 80 ]; then
            color=green
          elif [ "$coverage_percent" -ge 70 ]; then
            color=yellowgreen
          elif [ "$coverage_percent" -ge 60 ]; then
            color=yellow
          else
            color=red
          fi
          curl --fail --silent --show-error --location \
            "https://img.shields.io/badge/coverage-${coverage_percent}%25-${color}.svg" \
            --output coverage.svg

      - name: Upload coverage badge
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error

  package:
    name: built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Build wheel
        run: uv build --wheel

      - name: Install and invoke the built tool
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/agentic-preflight" --version
          "$UV_TOOL_DIR/agentic-preflight/bin/python" -c "import importlib.resources as r; assert r.files('agentic_preflight').joinpath('py.typed').is_file()"

  publish-coverage-badge:
    name: publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge

      - name: Publish badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          mv coverage.svg "$publish_dir/coverage.svg"
          cd "$publish_dir"
          git init --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.svg
          git commit -m "Update coverage badge"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin badges
