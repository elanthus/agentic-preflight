name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Manual runs get a group of their own, keyed by run id, so nothing can
  # supersede them. They are the documented pre-tag release check, and a
  # cancelled run reports neither pass nor fail: a releaser who sees the jobs
  # start and moves on to tagging would get the ceremony without the guarantee.
  # Pushes and pull requests keep the useful behaviour, where a newer run on the
  # same ref cancels the older one.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attestation:
    name: trusted preflight attestation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Check out the protected base commit, not the pull request, so a change
      # cannot weaken the verifier that judges its own attestation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install the trusted verifier
        run: uv tool install --python 3.11 .

      - name: Fetch and verify the pull request attestation
        env:
          ATTESTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          source_remote=origin
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            git remote add preflight-contributor "$HEAD_REPOSITORY_URL"
            source_remote=preflight-contributor
          fi
          git fetch --no-tags "$source_remote" \
            "refs/heads/$HEAD_REF:refs/remotes/preflight/head"
          test "$(git rev-parse refs/remotes/preflight/head)" = "$ATTESTED_SHA"
          git fetch --force --no-tags "$source_remote" \
            "refs/notes/agentic-preflight:refs/notes/agentic-preflight"
          agentic-preflight verify "$ATTESTED_SHA"

  test:
    # Linux and Windows on every pull request. macOS is close enough to Linux
    # that a Linux-only run catches most of what it would; Windows is not, and
    # its failures are the ones a contributor on macOS or Linux is least likely
    # to notice before merging. Run this workflow manually (workflow_dispatch)
    # to expand to the full matrix -- useful as a pre-tag check, since
    # release.yml only gates publishing after the tag is already pushed.
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]' }}
      python-versions: ${{ github.event_name == 'workflow_dispatch' && '["3.11", "3.12", "3.13"]' || '["3.13"]' }}
      coverage: true

  package:
    name: built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build wheel
        run: uv build --wheel

      - name: Install and invoke the built tool
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/agentic-preflight" --version
          test ! -e "$UV_TOOL_BIN_DIR/ap"
          # -P keeps the current directory off sys.path. Without it this runs from
          # the repository root, where the agentic_preflight source directory
          # shadows the installed package and the assertions inspect the checkout
          # instead of the wheel, passing even when the wheel is incomplete.
          "$UV_TOOL_DIR/agentic-preflight/bin/python" -P - <<'PY'
          import importlib.resources as resources

          package = resources.files("agentic_preflight")
          assert package.joinpath("py.typed").is_file(), "py.typed missing from wheel"
          assert package.joinpath("_bundled_skill").is_dir(), "bundled skill missing from wheel"
          print("wheel contents verified")
          PY

  publish-coverage-badge:
    name: publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge

      - name: Publish badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          mv coverage.svg "$publish_dir/coverage.svg"
          cd "$publish_dir"
          git init --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.svg
          git commit -m "Update coverage badge"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin badges
