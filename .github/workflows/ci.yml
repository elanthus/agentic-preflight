name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Manual runs get a group of their own, keyed by run id, so nothing can
  # supersede them. They are the documented pre-tag release check, and a
  # cancelled run reports neither pass nor fail: a releaser who sees the jobs
  # start and moves on to tagging would get the ceremony without the guarantee.
  # Pushes and pull requests keep the useful behaviour, where a newer run on the
  # same ref cancels the older one.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The trusted preflight attestation job lives in attestation.yml. It runs on
  # pull_request_target so the workflow definition itself comes from the
  # protected base branch; a pull_request trigger here would let the pull
  # request rewrite the job that judges it.

  test:
    # Validation tiers and release requirements: COMPATIBILITY.md#validation-tiers.
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest"]' }}
      python-versions: ${{ github.event_name == 'workflow_dispatch' && '["3.11", "3.12", "3.13"]' || '["3.13"]' }}
      coverage: true

  package:
    name: built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build wheel
        run: uv build --wheel

      - name: Install and invoke the built tool
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: bash scripts/smoke-wheel.sh

  publish-coverage-badge:
    name: publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge

      - name: Publish badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          git clone --branch badges --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$publish_dir"
          cp coverage.svg "$publish_dir/coverage.svg"
          cd "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge"
            git push origin badges
          fi
