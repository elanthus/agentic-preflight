name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check agentic_preflight tests

      - name: Type check (mypy)
        run: uv run mypy agentic_preflight

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=agentic_preflight --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  coverage:
    name: upload coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Defer coverage upload until the trusted branch build
        if: github.event_name == 'pull_request'
        run: echo "Coverage uploads run after merge on the trusted branch build."

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'

      - name: Download coverage artifact
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true
