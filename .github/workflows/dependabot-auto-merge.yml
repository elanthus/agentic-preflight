name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot-policy:
    uses: ./.github/workflows/dependabot-policy.yml

  auto-merge:
    needs: dependabot-policy
    if: needs.dependabot-policy.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout or execution of pull-request code with this write token.
      - name: Request auto-merge for the verified head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
