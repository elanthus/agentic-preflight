name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # Coverage is left off so the fail_under floor cannot block a release on a
    # platform-specific coverage difference; ci.yml enforces it on every push
    # and pull request.
    uses: ./.github/workflows/test.yml
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions: '["3.11", "3.12", "3.13"]'

  build:
    name: build and verify artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Verify tag matches project version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          project_version="$(python3 -c '
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          ')"
          expected_tag="v${project_version}"
          if [ "$GIT_TAG" != "$expected_tag" ]; then
            echo "::error::Tag ${GIT_TAG} does not match pyproject.toml version ${project_version} (expected ${expected_tag})."
            echo "PyPI version numbers cannot be reused. Delete the tag, fix the version, and re-tag."
            exit 1
          fi
          echo "Tag ${GIT_TAG} matches pyproject.toml version ${project_version}."

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build

      - name: Generate CycloneDX SBOM
        env:
          SBOM_PATH: sbom/agentic-preflight-${{ github.ref_name }}.cdx.json
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --preview-features sbom-export \
            --format cyclonedx1.5 \
            --output-file "$SBOM_PATH"

      - name: Smoke test the built wheel
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/agentic-preflight" --version
          test ! -e "$UV_TOOL_BIN_DIR/ap"
          # -P keeps the current directory off sys.path. Without it the step runs
          # from the repository root, where the agentic_preflight source directory
          # shadows the installed package and the assertions below inspect the
          # checkout instead of the wheel.
          "$UV_TOOL_DIR/agentic-preflight/bin/python" -P - <<'PY'
          import importlib.resources as resources

          package = resources.files("agentic_preflight")
          assert package.joinpath("py.typed").is_file(), "py.typed missing from wheel"
          assert package.joinpath("_bundled_skill").is_dir(), "bundled skill missing from wheel"
          print("wheel contents verified")
          PY

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
          sbom-path: sbom/agentic-preflight-${{ github.ref_name }}.cdx.json

      - name: Upload distributions and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            sbom/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-preflight
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
