[general]
base_ref = "main"

[commands]
test = "uv run pytest"
lint = "uv run ruff check . && uv run mypy agentic_preflight"

[docs]
enabled = true

[policy]
# Owner review is reserved for decision points: who may merge or publish, and the
# policy, ownership, and CI configuration that enforce it. Shared helpers, including
# configuration, models, and evidence-reuse fingerprints, are medium risk; they decide
# whether evidence can be reused, not whether a change may merge. Keep CODEOWNERS
# aligned with this list; see CONTRIBUTING.md.
human_review_paths = [
  # Policy, ownership, CI, and security guidance.
  ".agentic-preflight.toml",
  ".github/CODEOWNERS",
  ".github/dependabot.yml",
  ".github/workflows/**",
  "SECURITY.md",
  # Approval, attestation verification, hook, and publication decisions.
  "agentic_preflight/approval.py",
  "agentic_preflight/attestation.py",
  "agentic_preflight/cli_policy.py",
  "agentic_preflight/hook.py",
  "agentic_preflight/risk.py",
  "agentic_preflight/runs/publish.py",
]
# Routine skill documentation and implementation changes still receive full validation.
# Substantive instruction changes need owner approval; see CONTRIBUTING.md.
# Explicit human-review matches above win over these medium-risk defaults.
high_risk_paths = []
medium_risk_paths = ["agentic_preflight/**", "tests/**", "skill/**"]

[diff]
max_bytes = 500000

[pr]
mode = "auto"
automated_cleanup = true

[approval]
mode = "owner_review"
reviewer = "elanthus"
