[general]
base_ref = "main"

[commands]
test = "uv run pytest"
lint = "uv run ruff check . && uv run mypy agentic_preflight"

[docs]
enabled = true

[policy]
human_review_paths = [
  ".agentic-preflight.toml",
  ".github/CODEOWNERS",
  ".github/dependabot.yml",
  ".github/workflows/**",
  "SECURITY.md",
  # Direct approval, evidence-verification, and publication decisions.
  "agentic_preflight/approval.py",
  "agentic_preflight/attestation.py",
  "agentic_preflight/cli_policy.py",
  "agentic_preflight/config.py",
  "agentic_preflight/findings.py",
  "agentic_preflight/fingerprints.py",
  "agentic_preflight/hook.py",
  "agentic_preflight/machine.py",
  "agentic_preflight/models.py",
  "agentic_preflight/note_availability.py",
  "agentic_preflight/publish/**",
  "agentic_preflight/refresh_validation.py",
  "agentic_preflight/risk.py",
  "agentic_preflight/run_invariants.py",
  "agentic_preflight/runs/publish.py",
  "agentic_preflight/runs/review_coverage.py",
  "agentic_preflight/shell_fingerprints.py",
  "agentic_preflight/stages/change_scope.py",
  "agentic_preflight/wire_schema.py",
  "docs/RELEASING.md",
]
# Routine skill documentation and implementation changes still receive full validation.
# Substantive instruction changes need owner approval; see CONTRIBUTING.md.
# Explicit human-review matches above win over these medium-risk defaults.
high_risk_paths = []
medium_risk_paths = ["agentic_preflight/**", "tests/**", "skill/**"]

[diff]
max_bytes = 500000

[pr]
mode = "auto"
automated_cleanup = true

[approval]
mode = "owner_review"
reviewer = "elanthus"
