[project]
name = "agentic-cli"
version = "0.1.3"
description = "Agent-driven quality gate: a deterministic state machine with a JSON-over-stdout CLI. Calls no LLM, ever."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
]

[project.scripts]
agentic-cli = "agentic_cli.cli:main"
ac = "agentic_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.17",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_cli"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "agentic_cli/_bundled_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["agentic_cli"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "agentic_cli.runs"
# Persisted state narrows optional fields at runtime through state guards. Mypy
# cannot yet express that cross-field relationship; retain every other check.
disable_error_code = ["arg-type", "union-attr", "misc"]
