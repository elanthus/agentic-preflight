[project]
name = "agentic-preflight"
version = "0.2.0"
description = "Agent-driven quality gate: a deterministic state machine with a JSON-over-stdout CLI. Calls no LLM, ever."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael Swailes", email = "tokenmagic33@gmail.com" }]
keywords = ["cli", "git", "state-machine", "quality-gate", "agent", "pre-push", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/elanthus/agentic-preflight"
Repository = "https://github.com/elanthus/agentic-preflight"
Issues = "https://github.com/elanthus/agentic-preflight/issues"

[project.scripts]
agentic-preflight = "agentic_preflight.cli:main"
ap = "agentic_preflight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.17",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_preflight"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "agentic_preflight/_bundled_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentic_preflight"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["agentic_preflight"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
