[project]
name = "agentic-cli"
version = "0.1.1"
description = "Agent-driven quality gate: a deterministic state machine with a JSON-over-stdout CLI. Calls no LLM, ever."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
]

[project.scripts]
agentic-cli = "agentic_cli.cli:main"
ac = "agentic_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_cli"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "agentic_cli/_bundled_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
