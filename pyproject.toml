[project]
name = "agentic-preflight"
version = "0.2.1"
description = "Stops your coding agent from pushing unverified work. Your agent does the reviewing; a state machine records the result per-commit and gates the push."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "elanthus", email = "tokenmagic33@gmail.com" }]
keywords = ["cli", "git", "state-machine", "quality-gate", "agent", "pre-push", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/elanthus/agentic-preflight"
Repository = "https://github.com/elanthus/agentic-preflight"
Issues = "https://github.com/elanthus/agentic-preflight/issues"

[project.scripts]
agentic-preflight = "agentic_preflight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.17",
    "pip-audit>=2.10",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Explicit allowlist: the published sdist must never depend on what happens to be
# sitting in a local working tree (stray virtualenvs, caches, .env files).
include = [
    "/agentic_preflight",
    "/skill",
    "/tests",
    "/CHANGELOG.md",
    "/COMPATIBILITY.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/install.sh",
    "/uninstall.sh",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["agentic_preflight"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "agentic_preflight/_bundled_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentic_preflight"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "C4",
    "PIE",
    "PERF",
    "PT",
    "BLE",
    "S",
]
ignore = [
    # Executing programs is core functionality. Commands intentionally resolve
    # git, gh, and bash using the user's PATH.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"agentic_preflight/stages/change_scope.py" = ["PT028"]

[tool.mypy]
python_version = "3.11"
files = ["agentic_preflight"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
